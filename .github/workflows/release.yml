name: Publish plugin prerelease

on:
  schedule:
    # Check daily; publish only after at least 14 days and a new commit.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release eligibility
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          last=$(gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("auto-"))] | sort_by(.publishedAt) | last // empty')
          if [[ -n "$last" ]]; then
            tag=$(jq -r .tagName <<< "$last")
            previous=$(git rev-list -n 1 "$tag")
            if [[ "$previous" == "$GITHUB_SHA" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            published=$(date -u -d "$(jq -r .publishedAt <<< "$last")" +%s)
            if [[ "$EVENT_NAME" == schedule ]] && (( $(date -u +%s) - published < 1209600 )); then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "tag=auto-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Test backend
        if: steps.check.outputs.publish == 'true'
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.publish == 'true'
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build and package plugins
        if: steps.check.outputs.publish == 'true'
        run: |
          dotnet build plugins/ShortDrama/ShortDrama.csproj -c Release -o artifacts/jellyfin
          dotnet build plugins/ShortDrama/ShortDrama.csproj -c Release.Emby -o artifacts/emby
          for platform in jellyfin emby; do
            cp LICENSE plugins/ShortDrama/NOTICE "artifacts/$platform/"
            (cd "artifacts/$platform" && zip "../short-drama-$platform.zip" ShortDrama.dll LICENSE NOTICE)
          done
      - name: Publish prerelease
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/short-drama-jellyfin.zip artifacts/short-drama-emby.zip \
            --target "$GITHUB_SHA" --prerelease --title "Plugin prerelease $TAG" \
            --notes 'Jellyfin 10.11 and Emby 4.9.1.80 plugin builds. Installation and runtime compatibility on actual servers have not yet been verified. The backend is published separately as a container image.'
