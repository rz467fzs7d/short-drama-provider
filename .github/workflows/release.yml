name: Publish plugin prerelease

on:
  schedule:
    # Check daily; publish only after at least 14 days and a new commit.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release eligibility
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          releases=$(gh release list --limit 100 --json tagName,publishedAt)
          last=$(jq '[.[] | select((.tagName | startswith("auto-")) or (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.publishedAt) | last // empty' <<< "$releases")
          if [[ -n "$last" ]]; then
            tag=$(jq -r .tagName <<< "$last")
            previous=$(git rev-list -n 1 "$tag")
            if [[ "$previous" == "$GITHUB_SHA" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            published=$(date -u -d "$(jq -r .publishedAt <<< "$last")" +%s)
            if [[ "$EVENT_NAME" == schedule ]] && (( $(date -u +%s) - published < 1209600 )); then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          version=$(jq -r '[.[] | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v") | split(".") | map(tonumber)] | sort | last // [0,1,-1] | .[2] += 1 | map(tostring) | join(".")' <<< "$releases")
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Test backend
        if: steps.check.outputs.publish == 'true'
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.publish == 'true'
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build and package distributions
        if: steps.check.outputs.publish == 'true'
        run: |
          dotnet build plugins/ShortDrama/ShortDrama.csproj -c Release -o artifacts/jellyfin -p:Version=${{ steps.check.outputs.version }}
          dotnet build plugins/ShortDrama/ShortDrama.csproj -c Release.Emby -o artifacts/emby -p:Version=${{ steps.check.outputs.version }}
          for platform in jellyfin emby; do
            cp LICENSE plugins/ShortDrama/NOTICE "artifacts/$platform/"
            (cd "artifacts/$platform" && zip "../short-drama-$platform.zip" ShortDrama.dll LICENSE NOTICE)
          done
          mkdir -p artifacts/plex
          sed "s|ghcr.io/rz467fzs7d/short-drama-provider:latest|ghcr.io/rz467fzs7d/short-drama-provider:${GITHUB_SHA::7}|" compose.yml > artifacts/plex/compose.yml
          cp release/plex/README.md LICENSE artifacts/plex/
          (cd artifacts/plex && zip ../short-drama-plex.zip compose.yml README.md LICENSE)
      - name: Wait for matching backend image
        if: steps.check.outputs.publish == 'true'
        run: |
          for attempt in {1..30}; do
            if docker manifest inspect "ghcr.io/rz467fzs7d/short-drama-provider:${GITHUB_SHA::7}" >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo 'Matching backend image was not published' >&2
          exit 1
      - name: Publish prerelease
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/short-drama-plex.zip artifacts/short-drama-jellyfin.zip artifacts/short-drama-emby.zip \
            --target "$GITHUB_SHA" --prerelease --title "$TAG" \
            --notes 'Plex uses the backend in the Plex deployment package. Jellyfin 10.11 and Emby 4.9.1.80 use the separate plugin packages and the same backend. Jellyfin and Emby installation and runtime compatibility have not yet been verified on actual servers.'
