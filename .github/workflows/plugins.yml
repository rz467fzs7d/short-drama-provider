name: Build Media Server Plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "shared/**"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build Jellyfin plugin
        run: dotnet build plugins/jellyfin/ShortDrama.csproj -c Release -o artifacts/jellyfin
      - name: Build Emby plugin
        run: dotnet build plugins/emby/ShortDrama.csproj -c Release -o artifacts/emby
      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: short-drama-plugins
          path: |
            artifacts/jellyfin/ShortDrama.dll
            artifacts/emby/ShortDrama.dll
          if-no-files-found: error
