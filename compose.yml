services:
  short-drama-provider:
    image: ghcr.io/rz467fzs7d/short-drama-provider:latest
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "13230:3000"
    volumes:
      - short-drama-data:/data
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  short-drama-data:
